name: Release

on:
  push:
    branches: [master, release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend and native behavior
        run: |
          bun run test
          bun run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Check UI behavior
        run: |
          bunx playwright install --with-deps chromium
          bun run test:ui
      - name: Validate versions and identify this release
        id: metadata
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').split(/\n\[/)[0];
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (version !== tauriVersion || version !== cargoVersion) throw new Error('Package, Tauri, and Cargo versions must match');
          const stable = process.env.GITHUB_REF.startsWith('refs/tags/');
          const tag = stable ? process.env.GITHUB_REF_NAME : `preview-v${version}-${process.env.GITHUB_SHA.slice(0, 7)}`;
          if (stable && tag !== `v${version}`) throw new Error(`Release tag must be v${version}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\nprerelease=${!stable}\n`);
          JS

  prepare:
    name: Prepare draft release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create draft for installer uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Selective cleanup for JavaScript, Python, Rust, and PHP projects, plus individual files and downloads.

          Includes native folder selection, Open in Finder/Explorer and file reveal actions, editable per-target review with full paths and sizes, keyboard navigation, and summarized permission skips. Changing scan locations or settings requires a fresh scan before cleanup.

          Download the universal macOS DMG (Apple Silicon and Intel), Windows installer, or Linux DEB/AppImage below. macOS and Windows builds are not signed with distribution certificates; macOS builds are not notarized. No signing secrets are required for this preview.
          NOTES
          flags=(--draft --target "$GITHUB_SHA" --title "NodeShred $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi

  build:
    name: Build ${{ matrix.name }} installers
    needs: [verify, prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build and upload installers to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bash scripts/tauri-ci.sh
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: NodeShred ${{ needs.verify.outputs.version }}
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }} -- --locked

      - name: Include build failure details in the run summary
        if: failure()
        shell: bash
        run: |
          if [ -f src-tauri/target/ci-build.log ]; then
            {
              echo '### Build failure details'
              echo '```text'
              tail -n 100 src-tauri/target/ci-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish completed release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
